; VK3to2 Build 07 runtime options
; Full diagnostics remain enabled by default. Set audit=0 for representative
; performance checks without changing the DLL or compatibility behavior.

[trace]
audit=1
sampled_calls=1
nvidia_exceptions=1

[patches]
serialize_pipelines=0
disable_pipeline_cache=0
disable_debug_object_names=0
lower_renderpass2=0

; Fail-closed fallback from Build 06 for mismatches Build 07 cannot repair.
guard_incomplete_framebuffers=1

; Build 07 axis: append a proxy-owned dummy depth/stencil attachment when the
; framebuffer is missing exactly the final depth/stencil attachment declared by
; its render pass. A compatible shadow render pass gives that dummy attachment
; DONT_CARE load/store semantics.
repair_null_depth=1

; Safety cap: do not allocate pathological dummy depth surfaces such as the
; observed 32768x32768 Driveclub depth-only target. Such passes remain guarded.
repair_max_dimension=8192
