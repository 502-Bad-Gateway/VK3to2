; VK3to2 Build 10 runtime options
; Full diagnostics remain enabled by default. Set audit=0 for representative
; performance checks without changing the DLL or compatibility behavior.

[trace]
audit=1
sampled_calls=1
nvidia_exceptions=1

[patches]
serialize_pipelines=0
disable_pipeline_cache=0
disable_debug_object_names=0
lower_renderpass2=0

; Fail-closed fallback for mismatches that cannot be repaired safely.
guard_incomplete_framebuffers=1

; Proven Build 07 repair: append a proxy-owned dummy depth/stencil attachment
; when the framebuffer is missing exactly the final depth/stencil attachment.
repair_null_depth=1
repair_max_dimension=8192

; Build 09's exact DOAX compute bypass was a negative result for the 01.19
; pre-menu crash, so keep it disabled while testing the Build 10 graphics axis.
doax_compute_bypass=0

; Build 10 targets the two exact Full-GPU graphics pipelines created while
; ninja_vi.mp4 is finishing. SafeGPU does not create them and reaches ingame.
; Both are enabled for the first bounded test. If this avoids the crash, turn
; one off at a time to determine which pipeline matters without rebuilding.
doax119_bypass_video4989=1
doax119_bypass_videoc8c=1
