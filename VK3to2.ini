; VK3to2 Build 06 runtime options
; Guard only concrete framebuffers whose attachment count does not match their render pass.

[trace]
sampled_calls=1
nvidia_exceptions=1

[patches]
serialize_pipelines=0
disable_pipeline_cache=0
disable_debug_object_names=0
lower_renderpass2=0

; Build 06 axis. Suppress begin/end only for concrete framebuffer/render-pass
; attachment-count mismatches identified by Build 05.
guard_incomplete_framebuffers=1
