; VK3to2 Build 04 runtime options
; Build 04 isolates one compatibility translation: RenderPass2 commands to legacy render-pass commands.

[trace]
sampled_calls=1
nvidia_exceptions=1

[patches]
; Serialize vkCreateGraphicsPipelines/vkCreateComputePipelines through one lock.
serialize_pipelines=0

; Forward VK_NULL_HANDLE instead of shadPS4's pipeline cache to pipeline creation.
disable_pipeline_cache=0

; Build 03 axis is OFF so Build 04 does not mix workarounds.
disable_debug_object_names=0

; Lower vkCmdBeginRenderPass2/vkCmdNextSubpass2/vkCmdEndRenderPass2 (and KHR aliases)
; to legacy render-pass commands when the subpass pNext chains are empty.
lower_renderpass2=1
