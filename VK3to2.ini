; VK3to2 Build 03 runtime options
; Build 03 tests one rendering-neutral workaround by default: suppress Vulkan debug object naming.

[trace]
sampled_calls=1
nvidia_exceptions=1

[patches]
; Serialize vkCreateGraphicsPipelines/vkCreateComputePipelines through one lock.
serialize_pipelines=0

; Forward VK_NULL_HANDLE instead of shadPS4's pipeline cache to pipeline creation.
disable_pipeline_cache=0

; Do not forward vkSetDebugUtilsObjectNameEXT to the NVIDIA driver.
; This is the Build 03 test axis. Set to 0 to restore pass-through without rebuilding the DLL.
disable_debug_object_names=1
